# ============================================================================
# Æ TWA — FUSED RELAY — WRANGLER CONFIGURATION
# Repo: aei-relay (Cloudflare Workers)
# ============================================================================
# This is the ONLY wrangler.toml in the Æ TWA system. It lives exclusively
# in the aei-relay repository. The aei-backend repository does NOT contain a
# copy. This guarantees:
#   - exactly one `wrangler deploy` command can publish the Worker
#   - the Worker name 'ae-relay' cannot collide with a second deployment
#   - no deploy ordering can overwrite the live Worker with a stale copy
#
# Usage (from aei-relay/ repo root):
#   npm install -g wrangler        # or: npx wrangler
#   wrangler login
#   wrangler secret put BACKEND_URL   # backend base URL, never committed
#   wrangler secret put ALLOWED_ORIGIN  # Pages origin, never committed
#   wrangler secret put RELAY_KEY     # optional shared-secret gate
#   wrangler deploy
#
# After deploy, the printed URL (e.g. <RELAY-URL>)
# is what you assign to the frontend via ?backend= or to Heroku config.
# ============================================================================

name = "ae-relay"
main = "worker.js"
compatibility_date = "2024-01-01"

# NO [vars] BLOCK WITH REAL URLS. BACKEND_URL and ALLOWED_ORIGIN are
# secrets, set with `wrangler secret put`. Committing them here would put
# a backend URL in a file, which the Constraints forbid. The Worker reads them
# from env at request time. If BACKEND_URL is unset, the Worker returns
# 502, never a fake body.

# Workers Free tier: 100,000 requests/day.
# The Worker is a stateless proxy. It has no state to persist, no queues
# to drain, and no timers. Each request is: proxy to backend, return JSON.
# The only state is env.RELAY_KEY (managed by Wrangler secrets), and even
# that is consulted on read only.
#
# Observability: enable Workers Logs for per-request telemetry.
[observability]
enabled = false

# ----------------------------------------------------------------------------
# OPTIONAL — SHARED-SECRET GATE
# ----------------------------------------------------------------------------
# Do NOT inline the secret here. Set it once via:
#   wrangler secret put RELAY_KEY
# Wrangler stores it encrypted on Cloudflare's side and injects it as
# env.RELAY_KEY inside worker.js. If absent, the gate is skipped.
#
# [vars]
# RELAY_KEY = ""

# ----------------------------------------------------------------------------
# OPTIONAL — CUSTOM DOMAIN
# ----------------------------------------------------------------------------
# If you own a zone on Cloudflare, uncomment and replace with your hostname:
#
# routes = [
#   { pattern = "relay.example.com/*", zone_name = "example.com" }
# ]
#
# Then set the Heroku config var to match:
#   heroku config:set BACKEND_URL="<BACKEND-URL>" -a <HEROKU-APP>
